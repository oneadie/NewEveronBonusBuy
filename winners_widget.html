<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winners Widget</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&family=Russo+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="winners_styles.css">
    <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
</head>
<body>
    <div id="widget-header">
        <h1>
            <div class="header-everon">EVERON</div>
            <div class="header-bonusbuy">BONUSBUY <span class="header-buy-number">№<span id="widget-buy-number">1</span></span></div>
        </h1>
        <div class="widget-best">
            <div class="best-item">
                <span id="best-multiplier">🔥</span>
            </div>
            <div class="best-item">
                <span id="best-amount">💰</span>
            </div>
        </div>
        <div class="widget-totals">
            <span>💰 <span id="widget-spent">0</span></span>
            <span>🔢 <span id="widget-count">0</span></span>
            <span>📈 <span id="widget-percent">0%</span></span>
        </div>
    </div>
    <div id="winners-container">
        <div id="winners-list"></div>
    </div>
    <script src="winners_script.js"></script>
</body>
</html>
